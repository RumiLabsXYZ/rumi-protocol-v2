[package]
name = "liquidation_bot"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
test_endpoints = []
bot_driver_test = []

[dependencies]
candid = "0.10.6"
ic-stable-structures = "0.6.5"
ic-cdk = "0.12.0"
ic-cdk-timers = "0.10.0"
serde = "1.0.210"
serde_json = "1.0"
ic-cdk-macros = "0.8.3"
ic-canister-log = { git = "https://github.com/Rumi-Protocol/ic", rev = "fc278709" }
icrc-ledger-types = { git = "https://github.com/Rumi-Protocol/ic", rev = "fc278709" }
rumi_cycle_manager = { path = "../rumi_cycle_manager" }

[dev-dependencies]
candid_parser = "0.1"
pocket-ic = "6.0.0"
num-traits = "0.2"
sha2 = "0.10"
rumi_protocol_backend = { path = "../rumi_protocol_backend" }
