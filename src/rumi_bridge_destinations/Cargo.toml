[package]
name = "rumi_bridge_destinations"
version = "0.1.0"
edition = "2021"
description = "Typed, disabled destination profiles and validator for multichain icUSD groundwork"

[features]
default = []
# Client transport for the supply collector (IC query client and EVM JSON-RPC
# client). Off by default: a default build pulls none of these dependencies.
live-transport = ["dep:candid", "dep:ic-agent", "dep:reqwest", "dep:tokio"]

[dependencies]
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.96"
candid = { version = "0.10.12", optional = true }
ic-agent = { version = "0.37.1", optional = true }
reqwest = { version = "0.12.15", default-features = false, features = ["blocking", "rustls-tls"], optional = true }
tokio = { version = "1", default-features = false, features = ["rt"], optional = true }

[[example]]
name = "collect_live"
required-features = ["live-transport"]
