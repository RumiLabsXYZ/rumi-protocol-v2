[package]
name = "rumi_icusd_bridge"
version = "0.1.0"
edition = "2021"
description = "Escrow-backed ICP icUSD <-> Base icUSD bridge canister (v1)"

[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
# Integration-only helpers (local chain ids, faster timers). Never enabled in
# release builds.
test_endpoints = []

[dependencies]
candid = "0.10.6"
serde = { version = "1.0.210", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1.0.96"
ic-cdk = "0.12.0"
ic-cdk-timers = "0.10.0"
ic-stable-structures = "0.6.5"
ciborium = "0.2.1"
icrc-ledger-types = { git = "https://github.com/Rumi-Protocol/ic", rev = "fc278709" }
num-traits = "0.2"
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "arithmetic"] }
sha2 = "0.10.2"
sha3 = "0.10"
hex = "0.4"
alloy-rlp = "0.3"

[dev-dependencies]
candid_parser = "0.1"
pocket-ic = "6.0.0"
