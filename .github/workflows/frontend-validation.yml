name: Frontend validation

on:
  pull_request:
    paths:
      - '.github/workflows/frontend-validation.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'src/vault_frontend/**'
      - 'scripts/verify-frontend-auth-assets.mjs'

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify XRP deposit guidance
        run: npm test --workspace=src/vault_frontend -- src/lib/components/vault/XrpDepositTagNotice.spec.ts
      - name: Build frontend and verify auth assets
        run: npm run build --workspace=src/vault_frontend
